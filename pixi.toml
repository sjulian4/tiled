[workspace]
authors = ["Dan Allan <dallan@bnl.gov>"]
channels = ["conda-forge"]
name = "tiled"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.2.2"

[tasks]

[dependencies]
httpx = ">=0.20.0,!=0.23.1"
json-merge-patch = "*"
jsonpatch = "*"
jsonschema = "*"
msgpack-python = ">=1.0.0"
orjson = "*"
platformdirs = "*"
pydantic = ">=2,<3"
pydantic-settings = ">=2, <2.12.0"
pyyaml = "*"
typer = "*"
aiosqlite = ">=0.22.1,<0.23"
numpy = ">=2.2.6,<3"
pytest = ">=9.0.3,<10"
uvicorn = ">=0.49.0,<0.50"
sqlalchemy = ">=2.0.50,<3"
entrypoints = ">=0.4,<0.5"
stamina = ">=26.1.0,<27"
fastapi = ">=0.136.3,<0.137"
prometheus_client = ">=0.25.0,<0.26"
python-dateutil = ">=2.9.0.post0,<3"
jmespath = ">=1.1.0,<2"
awkward = ">=2.9.0,<3"
pyarrow = ">=24.0.0,<25"
dask = ">=2026.3.0,<2027"
sparse = ">=0.17.0,<0.19"
ndindex = ">=1.8,<2"
cachetools = ">=7.1.4,<8"
alembic = ">=1.18.4,<2"
canonicaljson = ">=2.0.0,<3"
numcodecs = ">=0.13.1,<0.17"
zarr = ">=2.18.3,<4"
python-jose = ">=3.5.0,<4"
pandas = ">=2.3.3,<4"
ipython = ">=8.37.0,<10"
asyncpg = ">=0.31.0,<0.32"
pytest-xdist = ">=3.8.0,<4"

[pypi-dependencies]
tiled = { path = ".", editable = true }
redis = "*"
jose = ">=1.0.0, <2"
python-jose = "*"
asgi-correlation-id = "*"
pytest-asyncio = "*"

[feature.array.dependencies]
dask = "*"
numpy = "*"

[feature.awkward.dependencies]
awkward = ">=2.4.3"

[feature.client.dependencies]
entrypoints = "*"
rich = "*"
stamina = "*"
watchfiles = "*"
websockets = "*"

[feature.compression.dependencies]
# python-blosc2 = "*"  # not available on Python < 3.11
lz4 = "*"
zstandard = "*"

[feature.dataframe.dependencies]
dask = "*"
pandas = "*"
pyarrow-all = ">=14.0.1"  # includes fix to CVE 2023-47248

[feature.dev.dependencies]
aiohttp = "*"
coverage = "*"
flake8 = "*"
hypothesis = "*"
ipython = "*"
ldap3 = "*"
matplotlib = "*"
minio = "*"
mistune = "*"
myst-parser = "*"
numpydoc = "*"
pre-commit = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-mock = "*"
pytest-rerunfailures = "*"
pytest-xdist = "*"
respx = "*"
sphinx = "!=4.1.0,!=4.1.1,!=4.1.2,!=4.2.0"
sphinx-click = "*"
sphinx-copybutton = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-mermaid = "*"
types-cachetools = "*"

[feature.formats.dependencies]
h5netcdf = "*"
h5py = "*"
hdf5plugin = "*"
openpyxl = "*"
pillow = "*"
tifffile = "*"

[feature.server.dependencies]
adbc-driver-manager = "*"
adbc-driver-postgresql = "*"
adbc-driver-sqlite = "*"
aiofiles = "*"
aiosqlite = "*"
alembic = "*"
anyio = "*"
asgi-correlation-id = "*"
asyncpg = "*"
cachetools = "*"
canonicaljson = "*"
dask = "*"
duckdb = "<1.4.0"  # https://github.com/bluesky/tiled/issues/1144
fastapi = ">=0.132.0"
jinja2 = "*"
jmespath = "*"
numcodecs = "*"
obstore = "*"
packaging = "*"
prometheus_client = "*"
python-dateutil = "*"
python-jose = "*"
python-multipart = "*"
redis-py = "*"
sqlalchemy = ">=2"
starlette = ">=0.48.0"
uvicorn = "*"
zarr = "*"

[feature.sparse.dependencies]
ndindex = "*"
pyarrow-all = ">=14.0.1"  # includes fix to CVE 2023-47248
sparse = ">=0.15.5"

[feature.xarray.dependencies]
dask = "*"
pandas = "*"
pyarrow-all = ">=14.0.1"  # includes fix to CVE 2023-47248
xarray = "*"

[feature.py310.dependencies]
python = "3.10.*"
# python-blosc2 is not available for Python 3.10

[feature.py311.dependencies]
python = "3.11.*"
python-blosc2 = "*"

[feature.py312.dependencies]
python = "3.12.*"
python-blosc2 = "*"

[feature.py313.dependencies]
python = "3.13.*"
python-blosc2 = "*"

[environments]
default = { solve-group = "default" }
all = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "server", "sparse", "xarray"], solve-group = "default" }
client = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "sparse", "xarray"], solve-group = "default" }
dev = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "dev", "server", "sparse", "xarray"], solve-group = "default" }
server = { features = ["array", "awkward", "compression", "dataframe", "formats", "server", "sparse", "xarray"], solve-group = "default" }

py310 = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "dev", "server", "sparse", "xarray", "py310"] }
py311 = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "dev", "server", "sparse", "xarray", "py311"] }
py312 = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "dev", "server", "sparse", "xarray", "py312"] }
py313 = { features = ["array", "awkward", "client", "compression", "dataframe", "formats", "dev", "server", "sparse", "xarray", "py313"] }
